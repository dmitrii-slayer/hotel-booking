server.port=8082

spring.application.name=booking-service

spring.datasource.url=jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:aG90ZWwtYm9va2luZy1kZW1vLXNlY3JldC0zMmJ5dGU=}
app.jwt.expiration=3600000

app.hotel.url=${HOTEL_SERVICE_URL:http://localhost:8081}
app.hotel.connect-timeout-ms=2000
app.hotel.read-timeout-ms=3000

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.hotelService.sliding-window-size=10
resilience4j.circuitbreaker.instances.hotelService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.hotelService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.hotelService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.hotelService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.hotelService.register-health-indicator=true

resilience4j.retry.instances.hotelService.max-attempts=3
resilience4j.retry.instances.hotelService.wait-duration=300ms
resilience4j.retry.instances.hotelService.enable-exponential-backoff=true
resilience4j.retry.instances.hotelService.exponential-backoff-multiplier=2
resilience4j.retry.instances.hotelService.retry-exceptions[0]=org.mephi.hotelbooking.booking.client.exception.RetryableHotelServiceException

logging.level.org.mephi.hotelbooking=DEBUG
logging.level.io.github.resilience4j=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n
