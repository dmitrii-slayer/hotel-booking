openapi: 3.0.3
info:
  title: Hotel Management Service API
  description: API управления отелями, номерами, статистикой загруженности и слотами занятости
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Прямой доступ к сервису
  - url: http://localhost:8080
    description: Через API Gateway

tags:
  - name: Отели
    description: Просмотр и администрирование отелей
  - name: Номера
    description: Просмотр, администрирование и статистика номеров

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateHotelRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          maxLength: 150
          example: "Гранд Отель Москва"
        address:
          type: string
          maxLength: 255
          example: "г. Москва, ул. Тверская, д. 1"
        description:
          type: string
          maxLength: 500
          example: "Пятизвёздочный отель в центре города"

    HotelResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "40d95c36-c832-4581-851e-8c0cf6419754"
        name:
          type: string
          example: "Гранд Отель Москва"
        address:
          type: string
          example: "г. Москва, ул. Тверская, д. 1"
        description:
          type: string
          example: "Пятизвёздочный отель в центре города"
        roomsCount:
          type: integer
          format: int64
          example: 42
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"

    CreateRoomRequest:
      type: object
      required: [hotelId, number, roomType, capacity, pricePerNight]
      properties:
        hotelId:
          type: string
          format: uuid
          example: "40d95c36-c832-4581-851e-8c0cf6419754"
        number:
          type: string
          maxLength: 20
          example: "101"
        roomType:
          $ref: '#/components/schemas/RoomType'
        capacity:
          type: integer
          minimum: 1
          example: 2
        pricePerNight:
          type: number
          format: double
          minimum: 0.01
          example: 7500.00
        available:
          type: boolean
          example: true

    UpdateRoomRequest:
      type: object
      description: Частичное обновление - null-поля игнорируются
      properties:
        number:
          type: string
          maxLength: 20
          example: "101"
        roomType:
          $ref: '#/components/schemas/RoomType'
        capacity:
          type: integer
          minimum: 1
          example: 3
        pricePerNight:
          type: number
          format: double
          minimum: 0.01
          example: 9000.00
        available:
          type: boolean
          example: false

    RoomType:
      type: string
      enum: [SINGLE, DOUBLE, TWIN, SUITE, FAMILY]

    RoomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "d473a3ef-f765-499f-9463-f2c101d94898"
        hotelId:
          type: string
          format: uuid
          example: "40d95c36-c832-4581-851e-8c0cf6419754"
        hotelName:
          type: string
          example: "Гранд Отель Москва"
        number:
          type: string
          example: "101"
        roomType:
          $ref: '#/components/schemas/RoomType'
        capacity:
          type: integer
          example: 2
        pricePerNight:
          type: number
          format: double
          example: 7500.00
        available:
          type: boolean
          example: true
        timesBooked:
          type: integer
          format: int64
          example: 12
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"

    ConfirmAvailabilityRequest:
      type: object
      required: [requestId, bookingId, startDate, endDate]
      properties:
        requestId:
          type: string
          maxLength: 100
          description: Корреляционный идентификатор для идемпотентности
          example: "83dd2e4c-d88e-4e8e-b164-ece66fef6264"
        bookingId:
          type: string
          maxLength: 100
          description: Идентификатор бронирования (сквозная корреляция)
          example: "f2d2c99d-88a6-433a-a30b-c001ac953d4f"
        startDate:
          type: string
          format: date
          example: "2027-02-01"
        endDate:
          type: string
          format: date
          example: "2027-02-05"

    ReleaseRequest:
      type: object
      required: [requestId, bookingId]
      properties:
        requestId:
          type: string
          maxLength: 100
          example: "83dd2e4c-d88e-4e8e-b164-ece66fef6264"
        bookingId:
          type: string
          maxLength: 100
          example: "f2d2c99d-88a6-433a-a30b-c001ac953d4f"

    AvailabilityResponse:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
          example: "c8b660f5-b57f-42df-801c-e586e328607f"
        roomId:
          type: string
          format: uuid
          example: "d473a3ef-f765-499f-9463-f2c101d94898"
        requestId:
          type: string
          example: "83dd2e4c-d88e-4e8e-b164-ece66fef6264"
        bookingId:
          type: string
          example: "f2d2c99d-88a6-433a-a30b-c001ac953d4f"
        startDate:
          type: string
          format: date
          example: "2027-02-01"
        endDate:
          type: string
          format: date
          example: "2027-02-05"
        status:
          type: string
          enum: [HOLD, CONFIRMED, RELEASED]
          example: HOLD
        replayed:
          type: boolean
          description: true, если запрос уже обрабатывался ранее
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"

    RoomLoadResponse:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
        number:
          type: string
          example: "101"
        hotelName:
          type: string
          example: "Гранд Отель Москва"
        timesBooked:
          type: integer
          format: int64
          example: 12
        activeReservations:
          type: integer
          format: int64
          example: 3
        bookedNights:
          type: integer
          format: int64
          example: 14
        loadPercent:
          type: number
          format: double
          example: 37.5
        horizonStart:
          type: string
          format: date
        horizonEnd:
          type: string
          format: date
        calculatedAt:
          type: string
          format: date-time

    ErrorDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Отель не найден: 40d95c36-c832-4581-851e-8c0cf6419754"
        path:
          type: string
          example: "/api/hotels/3f1c8a5e"
        traceId:
          type: string
          example: "a1b2c3d4e5f6"
        details:
          type: object
          additionalProperties:
            type: string

paths:
  /api/hotels:
    post:
      tags: [Отели]
      summary: Добавить отель
      operationId: createHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHotelRequest'
      responses:
        '200':
          description: Отель успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '401':
          description: Пользователь не авторизован
        '403':
          description: Нет прав (требуется ADMIN)
    get:
      tags: [Отели]
      summary: Получить список отелей
      operationId: getHotels
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по названию (регистронезависимый)
      responses:
        '200':
          description: Список отелей получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelResponse'

  /api/hotels/{hotelId}:
    parameters:
      - name: hotelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Отели]
      summary: Получить отель по идентификатору
      operationId: getHotelById
      responses:
        '200':
          description: Отель найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
        '404':
          description: Отель не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    put:
      tags: [Отели]
      summary: Обновить отель
      operationId: updateHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHotelRequest'
      responses:
        '200':
          description: Отель обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
    delete:
      tags: [Отели]
      summary: Удалить отель вместе с номерами
      operationId: deleteHotel
      responses:
        '204':
          description: Отель удалён
        '404':
          description: Отель не найден

  /api/rooms:
    post:
      tags: [Номера]
      summary: Добавить номер в отель
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '200':
          description: Номер создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          description: Отель не найден
    get:
      tags: [Номера]
      summary: Получить список свободных номеров
      description: Все операционно доступные номера. Если переданы даты - исключаются занятые на этот период.
      operationId: getAvailableRooms
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Список номеров получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'

  /api/rooms/recommend:
    get:
      tags: [Номера]
      summary: Получить рекомендованные номера
      description: Свободные номера, отсортированные по возрастанию times_booked, при равенстве - по идентификатору.
      operationId: getRecommendedRooms
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Список номеров получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'

  /api/rooms/statistics:
    get:
      tags: [Номера]
      summary: Статистика загруженности номеров
      operationId: getRoomStatistics
      parameters:
        - name: horizonStart
          in: query
          schema:
            type: string
            format: date
        - name: horizonEnd
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Статистика получена
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomLoadResponse'
        '403':
          description: Требуется роль ADMIN

  /api/rooms/hotel/{hotelId}:
    get:
      tags: [Номера]
      summary: Получить номера отеля
      operationId: getRoomsByHotel
      parameters:
        - name: hotelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список номеров получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'

  /api/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Номера]
      summary: Получить номер по идентификатору
      operationId: getRoomById
      responses:
        '200':
          description: Номер найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          description: Номер не найден
    patch:
      tags: [Номера]
      summary: Частично обновить номер
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Номер обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
    delete:
      tags: [Номера]
      summary: Удалить номер
      operationId: deleteRoom
      responses:
        '204':
          description: Номер удалён

  /api/rooms/{roomId}/confirm-availability:
    post:
      tags: [Номера]
      summary: Подтвердить доступность номера
      description: |
        Устанавливает временную блокировку слота на запрошенные даты.
        Внутренний эндпойнт Booking Service; идемпотентен по requestId.
        При конфликте дат возвращает 409 - Booking Service выполняет компенсацию.
      operationId: confirmAvailability
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAvailabilityRequest'
      responses:
        '200':
          description: Слот подтверждён (replayed=true при повторной доставке)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          description: Некорректный диапазон дат
        '409':
          description: Номер занят на запрошенные даты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'

  /api/rooms/{roomId}/release:
    post:
      tags: [Номера]
      summary: Снять временную блокировку слота
      description: |
        Компенсирующее действие для саги.
        Идемпотентен: повторный вызов не меняет состояние.
      operationId: releaseAvailability
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: Блокировка снята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'

  /api/rooms/booking/{bookingId}/confirm:
    post:
      tags: [Номера]
      summary: Зафиксировать слоты бронирования
      description: Переводит слоты бронирования из HOLD в CONFIRMED после успешного шага саги.
      operationId: confirmBookingSlots
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Слоты зафиксированы
