name: hotel-booking

services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: hotel-booking/eureka-server:1.0.0
    container_name: hotel-eureka
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - hotel-net

  hotel-service:
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    image: hotel-booking/hotel-service:1.0.0
    container_name: hotel-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aG90ZWwtYm9va2luZy1kZW1vLXNlY3JldC0zMmJ5dGU=}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks:
      - hotel-net

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    image: hotel-booking/booking-service:1.0.0
    container_name: booking-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      HOTEL_SERVICE_URL: http://hotel-service:8081
      JWT_SECRET: ${JWT_SECRET:-aG90ZWwtYm9va2luZy1kZW1vLXNlY3JldC0zMmJ5dGU=}
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks:
      - hotel-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: hotel-booking/api-gateway:1.0.0
    container_name: hotel-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-aG90ZWwtYm9va2luZy1kZW1vLXNlY3JldC0zMmJ5dGU=}
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - hotel-net

networks:
  hotel-net:
    driver: bridge
